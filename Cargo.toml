[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["violet cherry valentine"]
license = "CC-BY-NC-SA-4.0"

[workspace]
members = [
	"crates/zackophony",
	"crates/egui-phosphor",
	"crates/zackophony-installer",
]
resolver = "3"

[workspace.dependencies]
egui-phosphor = { path = "crates/egui-phosphor" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
