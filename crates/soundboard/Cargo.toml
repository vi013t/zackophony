[package]
name = "soundboard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
eframe = { version = "0.35.0", features = ["glow"] }
egui-phosphor.workspace = true
global-hotkey = "0.8.0"
rfd = "0.17.2"
ringbuf = "0.5.1"
rodio = "0.22.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
